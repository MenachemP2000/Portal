name: Deploy to Remote Server

on:
  push:
    branches:
      - main  # Trigger deployment only when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add SSH host to known hosts
      # Note: Since you are using StrictHostKeyChecking=no below, this step is technically 
      # optional, but it's good practice if you are using a pre-populated secret.
      run: echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no opc@130.110.238.171 << 'EOF'
          cd /home/opc/projects/Portal  # Navigate to the new OCI directory
          git pull origin main  # Pull the latest changes
          sudo systemctl stop Portal.service  # Stop the service
          npm install  # Ensure dependencies are up to date
          npm run build  # Build the app
          sudo systemctl start Portal.service  # Restart the service
        EOF